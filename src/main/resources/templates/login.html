<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{header :: layout(~{::content})}">

<head>
    <title>Вход</title>

</head>
<body>

<div th:fragment="content">

    <h2>Вход в личный кабинет</h2>

    <form th:action="@{/login}" method="post" class="login-form">
        <div class="form-group">
            <label for="username">Email или телефон</label>
            <input type="text" id="username" name="username" placeholder="example@mail.ru" required/>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль" required/>
        </div>

        <button type="submit" class="btn-login">Войти</button>

        <div class="register-link">
            Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
        </div>
    </form>
</div>
</body>
</html>
