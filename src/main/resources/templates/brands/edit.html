<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{header :: layout(~{::content})}">
<head>
    <title>Редактировать марку</title>
</head>
<body>
<div th:fragment="content">
    <h2>Редактирование марки</h2>
    <form th:action="@{/brands/{id}/edit(id=${brand.id})}" method="post" th:object="${brand}">
        <input type="hidden" th:field="*{id}"/>
        <div><label>Название: <input type="text" th:field="*{name}" required/></label></div>
        <div><label>Год основания: <input type="number" th:field="*{creationYear}" required/></label></div>
        <div><label>Телефон: <input type="text" th:field="*{contactPhone}" required/></label></div>
        <div><label>Email: <input type="email" th:field="*{contactEmail}" required/></label></div>
        <div><label>Описание: <textarea th:field="*{description}"></textarea></label></div>
        <div><label>Адрес: <input type="text" th:field="*{address}"/></label></div>
        <div><label>Код страны: <input type="text" th:field="*{countryCode}" maxlength="3" required/></label></div>
        <div><label>Логотип: <input type="text" th:field="*{logoSrc}" required/></label></div>
        <button type="submit">Сохранить</button>
    </form>
</div>
</body>
</html>
