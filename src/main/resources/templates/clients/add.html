<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{header :: layout(~{::content})}">
<head>
    <title>Добавить клиента</title>
</head>
<body>
<div th:fragment="content">
    <h2>Добавление нового клиента</h2>
    <form th:action="@{/clients/add}" method="post" th:object="${client}">
        <div><label>ФИО: <input type="text" th:field="*{name}" required/></label></div>
        <div><label>Email: <input type="email" th:field="*{email}" required/></label></div>
        <div><label>Телефон: <input type="text" th:field="*{phone}" required/></label></div>
        <div><label>Адрес: <input type="text" th:field="*{address}" required/></label></div>
        <div><label>Пароль: <input type="password" th:field="*{passwordHash}" required/></label></div>
        <button type="submit">Добавить</button>
    </form>
</div>
</body>
</html>
