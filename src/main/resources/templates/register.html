<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{header :: layout(~{::content})}">
<head>
    <title>Регистрация</title>
</head>
<body>
<div th:fragment="content">
    <h2>Регистрация нового клиента</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="@{/register}" th:object="${client}" method="post">
        <div>
            <label>ФИО:</label>
            <input type="text" th:field="*{name}" name="name" required
                   placeholder="Введите ваше полное имя"/>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" th:field="*{email}" name="email" required
                   placeholder="example@mail.com"/>
        </div>
        <div>
            <label>Телефон:</label>
            <input type="tel" th:field="*{phone}" name="phone" required
                   placeholder="+7 (999) 123-45-67"/>
        </div>
        <div>
            <label>Адрес:</label>
            <input type="text" th:field="*{address}" name="address" required
                   placeholder="Город, улица, дом"/>
        </div>
        <div>
            <label>Пароль:</label>
            <input type="password" th:field="*{passwordHash}" name="password" required
                   placeholder=""/>
        </div>
        <div>
            <label>Повторите пароль:</label>
            <input type="password" name="passwordConfirm" required
                   placeholder="повторите пароль"/>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
</div>
</body>
</html>
