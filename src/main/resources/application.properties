spring.application.name=web-prak
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost/wtprac?characterEncoding=UTF-8&client_encoding=UTF8
spring.datasource.username=postgres
spring.datasource.password=12345
