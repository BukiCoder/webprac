<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{header :: layout(~{::content})}">
<head>
    <title th:text="'Ошибка ' + ${status}">Ошибка</title>
</head>
<body>
<div th:fragment="content">
    <style>
        .error-container {
            text-align: center;
            padding: 3rem 1rem;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 0.5rem;
        }
        .error-message {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>

    <div class="error-container">
        <h1 class="error-code" th:text="${status}">404</h1>
        <h2 th:text="${error} ?: 'Произошла ошибка'"></h2>
        <p class="error-message" th:text="${message} ?: 'Попробуйте вернуться на главную'"></p>
        <a th:href="@{/}" class="btn">На главную</a>
    </div>
</div>
</body>
</html>
