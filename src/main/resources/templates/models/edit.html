<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{header :: layout(~{::content})}">
<head>
    <title>Редактировать модель</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 180px;
            font-weight: bold;
        }
        input, select {
            padding: 5px;
            width: 250px;
        }
        button {
            padding: 6px 12px;
            margin-top: 10px;
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .actions form {
            display: inline;
        }
        .actions a, .actions button {
            margin-right: 5px;
        }
        hr {
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div th:fragment="content">
    <h2>Редактирование модели</h2>
    <form th:action="@{/models/{id}/edit(id=${model.id})}" method="post" th:object="${model}">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label>Марка:</label>
            <select th:field="*{brand.id}" required>
                <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Название:</label>
            <input type="text" th:field="*{name}" required/>
        </div>

        <div class="form-group">
            <label>Год начала выпуска:</label>
            <input type="number" th:field="*{year}" required/>
        </div>

        <div class="form-group">
            <label>Мин. стоимость:</label>
            <input type="number" th:field="*{minCost}" required/>
        </div>

        <div class="form-group">
            <label>URL изображения:</label>
            <input type="text" th:field="*{imageSrc}"/>
        </div>

        <button type="submit">Сохранить модель</button>
    </form>

    <hr/>

    <h3>Комплектации</h3>
    <table>
        <thead>
        <tr>
            <th>Название</th>
            <th>Базовая</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="config : ${configurations}">
            <td th:text="${config.name}"></td>
            <td th:text="${config.isBasic} ? 'Да' : 'Нет'"></td>
            <td class="actions">
                <a th:href="@{/configurations/{id}/edit(id=${config.id})}">Редактировать</a>
                <form th:action="@{/configurations/{id}/delete(id=${config.id})}" method="post" style="display:inline">
                    <button type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/models/{id}/addConfig(id=${model.id})}" method="post" style="margin-top: 15px;">
        <button type="submit">Добавить новую комплектацию</button>
    </form>
</div>
</body>
</html>
