<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{header :: layout(~{::content})}">
<head>
    <title>Добавить модель</title>
</head>
<body>
<div th:fragment="content">
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .btn {
            padding: 0.6rem 1.5rem;
            font-size: 1rem;
        }
    </style>

    <div class="form-container">
        <h2>Добавление новой модели</h2>

        <form th:action="@{/models/add}" method="post" th:object="${model}">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

            <div class="form-group">
                <label>Название модели</label>
                <input type="text" th:field="*{name}" required placeholder="Например, Camry"/>
            </div>

            <div class="form-group">
                <label>Бренд</label>
                <select th:field="*{brand.id}" required>
                    <option value="">-- Выберите бренд --</option>
                    <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Год начала выпуска</label>
                <input type="number" th:field="*{year}" required placeholder="2020"/>
            </div>

            <div class="form-group">
                <label>Минимальная стоимость (руб.)</label>
                <input type="number" th:field="*{minCost}" required placeholder="1000000"/>
            </div>

            <div class="form-group">
                <label>URL изображения</label>
                <input type="text" th:field="*{imageSrc}" placeholder="/images/model.png"/>
            </div>

            <button type="submit" class="btn">Добавить модель</button>
        </form>
    </div>
</div>
</body>
</html>
